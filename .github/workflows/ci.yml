name: CI

# se ejecuta en cada push a main y en cada pull request
on:
  push:
    branches: [main]
  pull_request:

# si llega un push nuevo mientras el anterior sigue corriendo, se cancela el viejo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# el CI solo necesita leer el código
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          # gd: los tests suben fotos de prueba; pdo_sqlite: los tests usan SQLite en memoria
          extensions: mbstring, intl, bcmath, gd, zip, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Dependencias de Composer en caché
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      # lo mismo que pide el README: copiar el .env de ejemplo y generar la clave de la app
      - name: Preparar la aplicación
        run: |
          cp .env.example .env
          php artisan key:generate
          # las llaves de Passport no están en el repositorio (con razón): se generan aquí
          php artisan passport:keys --force

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exactamente lo que dice package-lock.json, sin tocarlo
      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npm run type-check

      - name: Tests
        run: npm run test:unit

      - name: Compilar
        run: npm run build-only
