# Un solo Nginx con dos sitios, uno por dominio:
#   - puerto 80   -> la SPA de Vue            (p. ej. app.midominio.com)
#   - puerto 8000 -> la API de Laravel + fotos (p. ej. api.midominio.com)
#
# Aquí no hay HTTPS: en el servidor lo pone el Nginx del propio VPS (con su certbot), que reenvía cada
# dominio al puerto que corresponde. En local se entra directo por http://localhost:8080 y :8000.

# ---------------- SPA ----------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # cualquier ruta que no sea un archivo devuelve index.html y la resuelve Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # los archivos compilados llevan un hash en el nombre: se pueden guardar un año
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html no se guarda en caché: es lo que apunta a los archivos con hash de cada versión
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PWA: el service worker y el manifiesto no llevan hash en el nombre, así que el navegador
    # debe preguntar siempre si cambiaron; si se guardaran, nadie recibiría las versiones nuevas
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # nunca servir archivos ocultos (.env, .git...)
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------------- API ----------------
server {
    listen 8000;
    server_name _;

    # la foto de perfil pesa hasta 2 MB
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;

    # Docker resuelve el nombre "app" con este DNS interno; con variable, Nginx lo vuelve a resolver
    # si el contenedor del backend se reinicia y cambia de IP
    resolver 127.0.0.11 valid=10s;

    # fotos de perfil: se leen del volumen de storage que comparte el backend (solo lectura)
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        expires 7d;
        access_log off;
    }

    # todo lo demás (/api/*, /docs/*, /up) entra por el index.php de Laravel
    location / {
        try_files /nonexistent @php;
    }

    location @php {
        set $php_upstream app:9000;
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
